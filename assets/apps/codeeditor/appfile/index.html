<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Code Editor</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.css">

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<h1>Code Editor</h1>

<div class="buttons">
<button id="run">Run</button>
<button id="save">Save</button>
<button id="clear">Clear</button>
</div>

</header>


<main>


<section class="editor">


<div class="tabs">

<button class="tab active" data-editor="html">HTML</button>
<button class="tab" data-editor="css">CSS</button>
<button class="tab" data-editor="js">JS</button>

</div>


<textarea id="html"></textarea>
<textarea id="css"></textarea>
<textarea id="js"></textarea>


</section>



<section class="preview">

<iframe id="preview"></iframe>

</section>


</main>



<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.js"></script>

<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/xml/xml.js"></script>

<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/css/css.js"></script>

<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.js"></script>


<script src="js/main.js"></script>


</body>

</html>
