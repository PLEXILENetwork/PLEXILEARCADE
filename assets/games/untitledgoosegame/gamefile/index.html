<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width="960" height="540" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>
  </div>

  <script>
    async function fetchWithProgress(url) {
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error("Failed to load: " + url);
      }

      return await response.arrayBuffer();
    }

    async function mergeFiles(fileParts) {
      const buffers = await Promise.all(
        fileParts.map(part => fetchWithProgress(part))
      );

      const mergedBlob = new Blob(buffers);
      return URL.createObjectURL(mergedBlob);
    }

    function getParts(baseUrl, start, end) {
      const parts = [];

      for (let i = start; i <= end; i++) {
        parts.push(baseUrl + ".part" + i);
      }

      return parts;
    }

    (async () => {
      const CDN =
        "https://cdn.jsdelivr.net/gh/geez-2/basicintro@main/intros/1/Build/";

      const [dataUrl, wasmUrl] = await Promise.all([
        mergeFiles(
          getParts(
            CDN + "Untitled%20Goose%20Game.data",
            1,
            4
          )
        ),

        mergeFiles(
          getParts(
            CDN + "Untitled%20Goose%20Game.wasm",
            1,
            2
          )
        )
      ]);

      const container = document.querySelector("#unity-container");
      const canvas = document.querySelector("#unity-canvas");
      const loadingBar = document.querySelector("#unity-loading-bar");
      const progressBarFull =
        document.querySelector("#unity-progress-bar-full");

      function unityShowBanner(msg, type) {
      }

      const buildUrl = CDN;

      const loaderUrl =
        buildUrl + "Untitled%20Goose%20Game.loader.js";

      const config = {
        arguments: [],
        dataUrl: dataUrl,
        frameworkUrl:
          buildUrl + "Untitled%20Goose%20Game.framework.js",
        codeUrl: wasmUrl,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "House House & Bog",
        productName: "Untitled Goose Game",
        productVersion: "0.2",
        showBanner: unityShowBanner
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        const meta = document.createElement("meta");

        meta.name = "viewport";
        meta.content =
          "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";

        document
          .getElementsByTagName("head")[0]
          .appendChild(meta);
      }

      loadingBar.style.display = "block";

      const script = document.createElement("script");

      script.src = loaderUrl;

      script.onload = () => {
        createUnityInstance(
          canvas,
          config,
          progress => {
            progressBarFull.style.width =
              100 * progress + "%";
          }
        )
        .then(unityInstance => {
          loadingBar.style.display = "none";
        })
        .catch(message => {
          console.error(message);
        });
      };

      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
