<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <style>
      body {
        background-color: black;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #gameContainer {
        width: 100vw !important;
        height: 100vh !important;
      }
      canvas {
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </head>
  <body>
    <div id="gameContainer"></div>
    <script src="Build/UnityLoader.js"></script>
    <script>
async function fetchWithProgress(url) {
  const response = await fetch(url);
  return await response.arrayBuffer();
}

    async function mergeFiles(fileParts, cacheKey) {
      const cache = await caches.open("t3-cache");
      const cachedResponse = await cache.match(cacheKey);
      if (cachedResponse) {
        const blob = await cachedResponse.blob();
        return URL.createObjectURL(blob);
      }
      const buffers = await Promise.all(
        fileParts.map(part => fetchWithProgress(part))
      );
      const mergedBlob = new Blob(buffers);
      const response = new Response(mergedBlob);
      await cache.put(cacheKey, response);
      return URL.createObjectURL(mergedBlob);
    }

    function getParts(file, start, end) {
      let parts = [];
      for (let i = start; i <= end; i++) {
        parts.push(file + ".part" + i);
      }
      return parts;
    }
    (async () => {
      const [dataUrl, wasmUrl] = await Promise.all([
        mergeFiles(getParts("Build/tungtungbog.data.unityweb", 1, 2), "tungtungbog.data.unityweb"),
        mergeFiles(getParts("Build/tungtungbog.wasm.code.unityweb", 1, 2), "tungtungbog.wasm.code.unityweb"),
      ]);

      const originalOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url, ...rest) {
          if (url.includes("tungtungbog.data.unityweb")) {
              url = dataUrl;
          } else if (url.includes("tungtungbog.wasm.code.unityweb")) {
              url = wasmUrl;
          }
          return originalOpen.call(this, method, url, ...rest);
      };
      var unityInstance = UnityLoader.instantiate("gameContainer", "Build/tungtungbog.json");
      loadingText.remove();
    })();
    </script>
  </body>
</html>
