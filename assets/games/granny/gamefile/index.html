<!DOCTYPE html>
<html lang="en-us">
<head>

<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

<link rel="stylesheet" href="TemplateData/style.css">
<script src="sdk.js"></script>


<style>

html, body {

    margin:0;
    padding:0;

    overflow:hidden;

    width:100%;
    height:100%;

    background:url('background.png') no-repeat center center fixed;
    background-size:cover;

}



#unity-container {

    position:absolute;

    width:100%;
    height:100%;

}



#unity-canvas {

    width:100%;
    height:100%;

}



#unity-warning {

    position:absolute;

    left:50%;
    top:5%;

    transform:translateX(-50%);

    background:white;

    padding:10px;

    display:none;

    border-radius:5px;

}



#unity-loader {

    position:absolute;

    inset:0;

    background:#000;

    color:#fff;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    font-size:1.4rem;

    z-index:10;

    font-family:Arial,sans-serif;

}



#merge-status {

    margin-top:10px;

    color:#C93131;

    font-size:0.9rem;

}



#unity-loader.hidden {

    display:none;

}


</style>


</head>


<body>


<div id="unity-container">


<div id="unity-loader">

    <div>Merging File</div>

    <div id="merge-status">
        [Starting Merge...]
    </div>

</div>


<canvas id="unity-canvas"></canvas>


<div id="unity-warning"></div>


</div>



<script>


var canvas =
document.querySelector("#unity-canvas");


var warningBanner =
document.querySelector("#unity-warning");


var mergeStatus =
document.getElementById("merge-status");


var gamePrefix = "Granny";

var dataParts = 2;

var wasmParts = 2;


var mergeMessages = [
    `[Merging ${gamePrefix}_part1.data...]`,
    `[Merging ${gamePrefix}_part2.data...]`,
    `[Merging ${gamePrefix}_part1.wasm...]`,
    `[Merging ${gamePrefix}_part2.wasm...]`,
    `[Checking ${gamePrefix}.framework.js...]`,
    "[Loading game data...]"

];



var mergeIndex = 0;



var mergeInterval = setInterval(function(){


    if(mergeIndex < mergeMessages.length){


        mergeStatus.innerHTML =
        mergeMessages[mergeIndex];


        mergeIndex++;


    }


},1000);







function unityShowBanner(msg,type){


    var div =
    document.createElement("div");


    div.innerHTML = msg;


    warningBanner.appendChild(div);



    if(type==="error"){

        div.style =
        "background:red;padding:10px;";

    }



    if(type==="warning"){


        div.style =
        "background:yellow;padding:10px;";


        setTimeout(()=>{


            warningBanner.removeChild(div);


        },5000);


    }



    warningBanner.style.display="block";


}







async function mergeUnityWebFiles(baseUrl,filePrefix,totalParts,extension){


    let buffers=[];



    for(let i=1;i<=totalParts;i++){



        let url =
        `${baseUrl}/${filePrefix}_part${i}.${extension}`;



        let response =
        await fetch(url);



        if(!response.ok){


            throw new Error(
            "Missing file: " + url
            );


        }



        buffers.push(
        await response.arrayBuffer()
        );


    }



    let totalSize =
    buffers.reduce(
    (size,buffer)=>size+buffer.byteLength,
    0
    );



    let merged =
    new Uint8Array(totalSize);



    let offset=0;



    for(let buffer of buffers){


        merged.set(
        new Uint8Array(buffer),
        offset
        );


        offset += buffer.byteLength;


    }



    return merged;


}






var buildUrl="Build";


var loaderUrl =
buildUrl + "/Granny.loader.js";







async function startGame(){


try{


const data =
await mergeUnityWebFiles(
buildUrl,
gamePrefix,
dataParts,
"data"
);




const wasm =
await mergeUnityWebFiles(
buildUrl,
gamePrefix,
wasmParts,
"wasm"
);





const dataUrl =
URL.createObjectURL(

new Blob(

[data],

{
type:"application/octet-stream"
}

)

);




const wasmUrl =
URL.createObjectURL(

new Blob(

[wasm],

{
type:"application/wasm"
}

)

);






var config = {


dataUrl:dataUrl,


frameworkUrl:
buildUrl + "/Granny.framework.js",


codeUrl:
wasmUrl,


streamingAssetsUrl:
"StreamingAssets",


companyName:
"Anastasia Kazantseva",


productName:
"Granny",


productVersion:
"1.0",


showBanner:
unityShowBanner


};







let script =
document.createElement("script");


script.src =
loaderUrl;





script.onload=function(){



createUnityInstance(

canvas,

config

)



.then(function(instance){



window.myGameInstance =
instance;



clearInterval(mergeInterval);



mergeStatus.innerHTML =
"[Merge Complete...]";



setTimeout(function(){


document
.getElementById("unity-loader")
.classList.add("hidden");


},25);



})



.catch(function(error){


console.error(error);

alert(error);


});


};




document.body.appendChild(script);



}



catch(error){


console.error(
"Game loading failed:",
error
);


alert(error);


}


}




startGame();



</script>


</body>

</html>
