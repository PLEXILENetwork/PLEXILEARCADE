<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
</head>
<body>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#111;
    font-family:Inter,Arial,sans-serif;
}

#app{
    position:relative;
    color:#fff;
    font-size:1.4rem;
}
</style>

<div id="app">Merging File...</div>

<script>
(async () => {
    const [part1, part2] = await Promise.all([
        fetch("index-part1.html").then(r => r.text()),
        fetch("index-part2.html").then(r => r.text())
    ]);

    document.open();
    document.write(part1 + part2);
    document.close();
})();
</script>

</body>
</html>
