<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#000;
    font-family:Inter,Arial,sans-serif;
}

#app{
    color:#fff;
    font-size:1.4rem;
    text-align:center;
}

#merge-status{
    margin-top:10px;
    color:#C93131;
    font-size:0.9rem;
}
</style>

</head>

<body>

<div id="app">
    <div>Merging File</div>
    <div id="merge-status">
        [Starting Merge...]
    </div>
</div>

<script>

const CDN_BASE =
"https://cdn.jsdelivr.net/gh/geez-2/basicintro@main/intros/9/";

const mergeStatus =
document.getElementById("merge-status");

const mergeMessages = [
    "[Merging online-part1.html...]",
    "[Merging online-part2.html...]",
    "[Merging online-part3.html...]",
    "[Checking files...]",
    "[Loading webpage...]"
];

let mergeIndex = -1;

const mergeInterval = setInterval(function(){

    mergeIndex++;

    if(mergeIndex < mergeMessages.length){

        mergeStatus.textContent =
            mergeMessages[mergeIndex];

        if(mergeIndex === mergeMessages.length - 1){
            clearInterval(mergeInterval);
        }
    }

},1000);


(async () => {

    try{

        const [part1, part2, part3] = await Promise.all([

            fetch(CDN_BASE + "online-part1.html")
                .then(response => {
                    if(!response.ok)
                        throw new Error(
                            "Failed to load online-part1.html"
                        );
                    return response.text();
                }),

            fetch(CDN_BASE + "online-part2.html")
                .then(response => {
                    if(!response.ok)
                        throw new Error(
                            "Failed to load online-part2.html"
                        );
                    return response.text();
                }),

            fetch(CDN_BASE + "online-part3.html")
                .then(response => {
                    if(!response.ok)
                        throw new Error(
                            "Failed to load online-part3.html"
                        );
                    return response.text();
                })

        ]);


        while(
            mergeIndex < mergeMessages.length - 1
        ){

            await new Promise(resolve =>
                setTimeout(resolve,50)
            );

        }


        document.open();

        document.write(
            part1 +
            part2 +
            part3
        );

        document.close();


    }catch(error){

        clearInterval(mergeInterval);

        mergeStatus.textContent =
            "[Merge Failed...]";

        console.error(
            "Merge failed:",
            error
        );

    }

})();

</script>

</body>
</html>
