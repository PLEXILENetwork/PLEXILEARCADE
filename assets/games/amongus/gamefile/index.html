<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            position: relative;
        }

        @font-face {
            font-family: "Impostograph";
            src: url("Impostograph-Regular.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
        }


        .space {
            position: fixed;
            inset: 0;
            background: #000;
            overflow: hidden;
            z-index: 0;
        }

        .stars {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            background: #fff;
            box-shadow:
                0 0 5px rgba(255,255,255,.9),
                0 0 11px rgba(255,255,255,.35);
            animation: starDrift linear infinite;
        }

        .star:nth-child(1) {
            width: 4px;
            height: 4px;
            top: 6%;
            left: 108%;
            animation-duration: 22s;
        }

        .star:nth-child(2) {
            width: 3px;
            height: 3px;
            top: 12%;
            left: 82%;
            animation-duration: 29s;
        }

        .star:nth-child(3) {
            width: 5px;
            height: 5px;
            top: 20%;
            left: 125%;
            animation-duration: 25s;
        }

        .star:nth-child(4) {
            width: 2px;
            height: 2px;
            top: 28%;
            left: 95%;
            animation-duration: 34s;
        }

        .star:nth-child(5) {
            width: 4px;
            height: 4px;
            top: 36%;
            left: 118%;
            animation-duration: 27s;
        }

        .star:nth-child(6) {
            width: 3px;
            height: 3px;
            top: 44%;
            left: 90%;
            animation-duration: 21s;
        }

        .star:nth-child(7) {
            width: 5px;
            height: 5px;
            top: 51%;
            left: 135%;
            animation-duration: 31s;
        }

        .star:nth-child(8) {
            width: 3px;
            height: 3px;
            top: 59%;
            left: 112%;
            animation-duration: 24s;
        }

        .star:nth-child(9) {
            width: 4px;
            height: 4px;
            top: 66%;
            left: 102%;
            animation-duration: 28s;
        }

        .star:nth-child(10) {
            width: 2px;
            height: 2px;
            top: 73%;
            left: 130%;
            animation-duration: 37s;
        }

        .star:nth-child(11) {
            width: 5px;
            height: 5px;
            top: 80%;
            left: 115%;
            animation-duration: 26s;
        }

        .star:nth-child(12) {
            width: 3px;
            height: 3px;
            top: 88%;
            left: 140%;
            animation-duration: 32s;
        }

        .star:nth-child(13) {
            width: 2px;
            height: 2px;
            top: 94%;
            left: 108%;
            animation-duration: 39s;
        }

        .star:nth-child(14) {
            width: 4px;
            height: 4px;
            top: 16%;
            left: 145%;
            animation-duration: 30s;
        }

        .star:nth-child(15) {
            width: 3px;
            height: 3px;
            top: 33%;
            left: 155%;
            animation-duration: 35s;
        }

        .star:nth-child(16) {
            width: 5px;
            height: 5px;
            top: 47%;
            left: 150%;
            animation-duration: 28s;
        }

        .star:nth-child(17) {
            width: 2px;
            height: 2px;
            top: 61%;
            left: 160%;
            animation-duration: 42s;
        }

        .star:nth-child(18) {
            width: 4px;
            height: 4px;
            top: 76%;
            left: 150%;
            animation-duration: 33s;
        }

        .star:nth-child(19) {
            width: 3px;
            height: 3px;
            top: 84%;
            left: 165%;
            animation-duration: 36s;
        }

        .star:nth-child(20) {
            width: 5px;
            height: 5px;
            top: 3%;
            left: 150%;
            animation-duration: 30s;
        }

        .star:nth-child(21) {
            width: 2px;
            height: 2px;
            top: 25%;
            left: 170%;
            animation-duration: 44s;
        }

        .star:nth-child(22) {
            width: 4px;
            height: 4px;
            top: 55%;
            left: 160%;
            animation-duration: 31s;
        }

        .star:nth-child(23) {
            width: 3px;
            height: 3px;
            top: 70%;
            left: 175%;
            animation-duration: 40s;
        }

        .star:nth-child(24) {
            width: 5px;
            height: 5px;
            top: 91%;
            left: 155%;
            animation-duration: 34s;
        }

        @keyframes starDrift {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-200vw);
            }
        }

        .menu {
            position: fixed;
            inset: 0;
            z-index: 10;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 30px;

            transform: translateY(-3vh);
        }

        .banner {
            display: block;

            width: min(520px, 72vw);
            height: auto;

            margin-bottom: 7px;

            object-fit: contain;

            user-select: none;
            pointer-events: none;
        }

        .choose-title {
            color: #f8c22d;

            font-size: clamp(1.25rem, 2.8vw, 2rem);
            font-weight: 900;

            letter-spacing: 2px;
            text-align: center;

            margin-bottom: 40px;

            text-shadow:
                2px 2px 0 #000,
                0 0 8px rgba(255,140,0,.15);
        }

        .modes {
            display: flex;
            flex-direction: row;

            align-items: center;
            justify-content: center;

            gap: 24px;
        }

        .mode-button {
            position: relative;
            margin-bottom: 25px;
            width: 225px;
            height: 82px;

            border: 4px solid #fff;
            border-radius: 19px;

            background: #050505;
            color: #fff;

            font-family: "Impostograph", sans-serif;
            font-size: 2.8rem;
            font-weight: 1000;

            letter-spacing: 2px;

            cursor: pointer;
            outline: none;

            box-shadow:
                4px 4px 0 #000,
                0 0 0 2px #000;


        }

        .mode-button:hover {
            background: #242424;
            border-color: #15e943;
            color: #15e943;

        }

        .mode-button:active {
            transform: translate(5px, 5px);

            box-shadow:
                3px 3px 0 #000,
                0 0 0 2px #000;
        }

        .floating-crewmate {
            position: fixed;

            z-index: 3;

            pointer-events: none;
            user-select: none;

            will-change: transform;
        }

        .floating-crewmate img {
            display: block;

            width: 135px;
            height: auto;
        }

        .crewmate-1 {
            width: 135px;

            top: 4%;
            left: -170px;

            animation: crewmateOne 48s linear infinite;
        }

        .crewmate-2 {
            width: 125px;

            top: 64%;
            left: 110%;

            animation: crewmateTwo 54s linear infinite;
            animation-delay: -21s;
        }

        .crewmate-3 {
            width: 115px;

            top: 24%;
            left: 108%;

            animation: crewmateThree 51s linear infinite;
            animation-delay: -31s;
        }

        .crewmate-4 {
            width: 130px;

            top: 80%;
            left: -180px;

            animation: crewmateFour 58s linear infinite;
            animation-delay: -15s;
        }

        @keyframes crewmateOne {
            0% {
                transform: translate(-5vw, 8vh) rotate(-12deg);
            }

            15% {
                transform: translate(10vw, 3vh) rotate(5deg);
            }

            30% {
                transform: translate(28vw, 12vh) rotate(24deg);
            }

            45% {
                transform: translate(47vw, 2vh) rotate(43deg);
            }

            60% {
                transform: translate(65vw, 10vh) rotate(63deg);
            }

            75% {
                transform: translate(84vw, -2vh) rotate(82deg);
            }

            90% {
                transform: translate(103vw, 8vh) rotate(101deg);
            }

            100% {
                transform: translate(120vw, 1vh) rotate(114deg);
            }
        }

        @keyframes crewmateTwo {
            0% {
                transform: translate(5vw, 0) rotate(18deg);
            }

            15% {
                transform: translate(-9vw, -4vh) rotate(8deg);
            }

            30% {
                transform: translate(-25vw, 5vh) rotate(-8deg);
            }

            45% {
                transform: translate(-43vw, -3vh) rotate(-25deg);
            }

            60% {
                transform: translate(-61vw, 7vh) rotate(-43deg);
            }

            75% {
                transform: translate(-80vw, -2vh) rotate(-60deg);
            }

            90% {
                transform: translate(-100vw, 5vh) rotate(-76deg);
            }

            100% {
                transform: translate(-122vw, -1vh) rotate(-92deg);
            }
        }

        @keyframes crewmateThree {
            0% {
                transform: translate(4vw, -2vh) rotate(8deg);
            }

            15% {
                transform: translate(-9vw, 2vh) rotate(18deg);
            }

            30% {
                transform: translate(-25vw, -5vh) rotate(30deg);
            }

            45% {
                transform: translate(-42vw, 5vh) rotate(45deg);
            }

            60% {
                transform: translate(-61vw, -4vh) rotate(61deg);
            }

            75% {
                transform: translate(-80vw, 3vh) rotate(78deg);
            }

            90% {
                transform: translate(-101vw, -5vh) rotate(94deg);
            }

            100% {
                transform: translate(-123vw, 2vh) rotate(110deg);
            }
        }

        @keyframes crewmateFour {
            0% {
                transform: translate(-4vw, -2vh) rotate(-20deg);
            }

            15% {
                transform: translate(10vw, 4vh) rotate(-8deg);
            }

            30% {
                transform: translate(27vw, -4vh) rotate(8deg);
            }

            45% {
                transform: translate(45vw, 6vh) rotate(27deg);
            }

            60% {
                transform: translate(64vw, -4vh) rotate(45deg);
            }

            75% {
                transform: translate(83vw, 5vh) rotate(64deg);
            }

            90% {
                transform: translate(103vw, -3vh) rotate(82deg);
            }

            100% {
                transform: translate(123vw, 3vh) rotate(100deg);
            }
        }

        @media (max-width: 700px) {
            .menu {
                transform: translateY(-2vh);
                padding: 20px;
            }

            .banner {
                width: min(420px, 84vw);
                margin-bottom: 5px;
            }

            .choose-title {
                font-size: 1.2rem;
                margin-bottom: 15px;
            }

            .modes {
                gap: 12px;
            }

            .mode-button {
                width: 43vw;
                max-width: 200px;
                height: 70px;

                font-size: 2rem;

                border-width: 3px;
                border-radius: 16px;

                box-shadow:
                    6px 6px 0 #000,
                    0 0 0 2px #000;
            }

            .floating-crewmate img {
                width: 105px;
            }

            .crewmate-1 {
                width: 105px;
            }

            .crewmate-2 {
                width: 98px;
            }

            .crewmate-3 {
                width: 90px;
            }

            .crewmate-4 {
                width: 100px;
            }
        }
    </style>
</head>

<body>

    <audio id="themeMusic" src="theme.mp3" loop></audio>

    <div class="space">
        <div class="stars">
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
        </div>
    </div>

    <div class="floating-crewmate crewmate-1">
        <img src="crewmate1.png" alt="">
    </div>

    <div class="floating-crewmate crewmate-2">
        <img src="crewmate2.png" alt="">
    </div>

    <div class="floating-crewmate crewmate-3">
        <img src="crewmate3.png" alt="">
    </div>

    <div class="floating-crewmate crewmate-4">
        <img src="crewmate4.png" alt="">
    </div>

    <main class="menu">

        <img
            class="banner"
            src="banner.png"
            alt="Among Us"
        >

        <h1 class="choose-title">
            CHOOSE YOUR MODE:
        </h1>

        <div class="modes">

            <button
                class="mode-button"
                onclick="window.location.href='offline.html'">
                OFFLINE
            </button>

            <button
                class="mode-button"
                onclick="window.location.href='online.html'">
                ONLINE
            </button>

        </div>

    </main>

    <script>
        const themeMusic = document.getElementById("themeMusic");

        themeMusic.volume = 0.45;

        function startMusic() {
            themeMusic.play().catch(() => {});
            document.removeEventListener("click", startMusic);
            document.removeEventListener("keydown", startMusic);
            document.removeEventListener("touchstart", startMusic);
        }

        document.addEventListener("click", startMusic);
        document.addEventListener("keydown", startMusic);
        document.addEventListener("touchstart", startMusic);

        window.addEventListener("load", () => {
            themeMusic.play().catch(() => {});
        });
    </script>

</body>
</html>
