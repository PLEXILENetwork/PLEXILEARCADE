<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/geez-2/basicintro@main/intros/5/style.css"
    >
</head>

<body>

    <script>
        const CDN_BASE =
            "https://cdn.jsdelivr.net/gh/geez-2/basicintro@main/intros/5/";

        const originalFetch = window.fetch;

        const mergedFiles = {};

        async function mergeParts(
            filename,
            count
        ) {
            if (mergedFiles[filename]) {
                return mergedFiles[filename];
            }

            const buffers = [];

            for (let i = 1; i <= count; i++) {

                const url =
                    CDN_BASE +
                    filename +
                    ".part" +
                    i;

                const response =
                    await originalFetch(url);

                if (!response.ok) {
                    throw new Error(
                        "Failed to load " +
                        url
                    );
                }

                buffers.push(
                    await response.arrayBuffer()
                );
            }

            const blob =
                new Blob(buffers);

            const objectURL =
                URL.createObjectURL(blob);

            mergedFiles[filename] =
                objectURL;

            return objectURL;
        }

        /*
         * Godot asks for index.pck.
         * Redirect that request to our merged
         * index.pck Blob.
         */
        window.fetch = async function(
            input,
            options
        ) {

            const url =
                typeof input === "string"
                    ? input
                    : input.url;

            if (
                url &&
                /(?:^|\/)index\.pck(?:\?.*)?$/.test(url)
            ) {

                const mergedURL =
                    await mergeParts(
                        "index.pck",
                        2
                    );

                return originalFetch(
                    mergedURL,
                    options
                );
            }

            if (
                url &&
                /(?:^|\/)index\.wasm(?:\?.*)?$/.test(url)
            ) {

                const mergedURL =
                    await mergeParts(
                        "index.wasm",
                        3
                    );

                return originalFetch(
                    mergedURL,
                    options
                );
            }

            return originalFetch(
                input,
                options
            );
        };

        /*
         * Some Godot builds use XMLHttpRequest
         * instead of fetch().
         */
        const OriginalXHR =
            window.XMLHttpRequest;

        function CDNXMLHttpRequest() {

            const xhr =
                new OriginalXHR();

            const originalOpen =
                xhr.open;

            xhr.open = function(
                method,
                url,
                async,
                user,
                password
            ) {

                if (
                    url &&
                    /(?:^|\/)index\.pck(?:\?.*)?$/.test(url)
                ) {

                    mergeParts(
                        "index.pck",
                        2
                    ).then(
                        mergedURL => {

                            originalOpen.call(
                                xhr,
                                method,
                                mergedURL,
                                async !== false,
                                user,
                                password
                            );

                        }
                    );

                    return;
                }

                if (
                    url &&
                    /(?:^|\/)index\.wasm(?:\?.*)?$/.test(url)
                ) {

                    mergeParts(
                        "index.wasm",
                        3
                    ).then(
                        mergedURL => {

                            originalOpen.call(
                                xhr,
                                method,
                                mergedURL,
                                async !== false,
                                user,
                                password
                            );

                        }
                    );

                    return;
                }

                return originalOpen.call(
                    xhr,
                    method,
                    url,
                    async !== false,
                    user,
                    password
                );
            };

            return xhr;
        }

        window.XMLHttpRequest =
            CDNXMLHttpRequest;
    </script>

    <script
        src="https://cdn.jsdelivr.net/gh/geez-2/basicintro@main/intros/5/main.js"
    ></script>

    <canvas id="canvas">
        Your browser does not support the canvas tag.
    </canvas>

    <noscript>
        Your browser does not support JavaScript.
    </noscript>

    <div id="status">

        <img
            id="status-splash"
            class="show-image--true fullsize--true use-filter--true"
            src="https://cdn.jsdelivr.net/gh/geez-2/basicintro@main/intros/5/index.png"
            alt=""
        >

        <progress
            id="status-progress"
        ></progress>

        <div
            id="status-notice"
        ></div>

    </div>

    <script
        src="https://cdn.jsdelivr.net/gh/geez-2/basicintro@main/intros/5/index.js"
    ></script>

    <script>

        const GODOT_CONFIG = {

            args: [],

            canvasResizePolicy: 2,

            ensureCrossOriginIsolationHeaders:
                true,

            executable: "index",

            experimentalVK: false,

            fileSizes: {

                "index.pck":
                    38662480,

                "index.wasm":
                    43699190

            },

            focusCanvas: true,

            gdextensionLibs: []

        };

        const GODOT_THREADS_ENABLED =
            false;

        const engine =
            new Engine(
                GODOT_CONFIG
            );

        function run() {

            const statusOverlay =
                document.getElementById(
                    "status"
                );

            const statusProgress =
                document.getElementById(
                    "status-progress"
                );

            const statusNotice =
                document.getElementById(
                    "status-notice"
                );

            let initializing = true;

            let statusMode = "";

            function setStatusMode(
                mode
            ) {

                if (
                    statusMode === mode ||
                    !initializing
                ) {
                    return;
                }

                if (
                    mode === "hidden"
                ) {

                    statusOverlay.remove();

                    initializing =
                        false;

                    return;
                }

                statusOverlay.style.visibility =
                    "visible";

                statusProgress.style.display =
                    mode === "progress"
                        ? "block"
                        : "none";

                statusNotice.style.display =
                    mode === "notice"
                        ? "block"
                        : "none";

                statusMode =
                    mode;
            }

            function setStatusNotice(
                text
            ) {

                while (
                    statusNotice.lastChild
                ) {

                    statusNotice.removeChild(
                        statusNotice.lastChild
                    );
                }

                const lines =
                    text.split("\n");

                lines.forEach(
                    line => {

                        statusNotice.appendChild(
                            document.createTextNode(
                                line
                            )
                        );

                        statusNotice.appendChild(
                            document.createElement(
                                "br"
                            )
                        );

                    }
                );
            }

            function displayFailureNotice(
                err
            ) {

                console.error(err);

                if (
                    err instanceof Error
                ) {

                    setStatusNotice(
                        err.message
                    );

                } else if (
                    typeof err === "string"
                ) {

                    setStatusNotice(
                        err
                    );

                } else {

                    setStatusNotice(
                        "An unknown error occurred."
                    );

                }

                setStatusMode(
                    "notice"
                );

                initializing =
                    false;
            }

            const missing =
                Engine.getMissingFeatures({
                    threads:
                        GODOT_THREADS_ENABLED
                });

            if (
                missing.length !== 0
            ) {

                const missingMsg =
                    "Error\n" +
                    "The following features required to run Godot projects on the Web are missing:\n";

                displayFailureNotice(
                    missingMsg +
                    missing.join("\n")
                );

            } else {

                setStatusMode(
                    "progress"
                );

                engine.startGame({

                    onProgress:
                        function (
                            current,
                            total
                        ) {

                            if (
                                current > 0 &&
                                total > 0
                            ) {

                                statusProgress.value =
                                    current;

                                statusProgress.max =
                                    total;

                            } else {

                                statusProgress.removeAttribute(
                                    "value"
                                );

                                statusProgress.removeAttribute(
                                    "max"
                                );

                            }

                        }

                }).then(

                    () => {
                        setStatusMode(
                            "hidden"
                        );
                    },

                    displayFailureNotice
                );
            }
        }

        window.godotRunStart =
            run;

        run();

    </script>

</body>
</html>
