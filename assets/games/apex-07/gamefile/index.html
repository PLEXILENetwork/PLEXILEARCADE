<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0"
>

<link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
>

<style>

html,
body,
#canvas {
    margin: 0;
    padding: 0;
    border: 0;
}

body {
    color: white;
    background-color: black;
    overflow: hidden;
    touch-action: none;
}

#canvas {
    display: block;
}

#canvas:focus {
    outline: none;
}

#status,
#status-splash,
#status-progress {
    position: absolute;
    left: 0;
    right: 0;
}

#status,
#status-splash {
    top: 0;
    bottom: 0;
}

#status {
    background-color: #242424;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    visibility: hidden;
}

#status-splash {
    max-height: 100%;
    max-width: 100%;
    margin: auto;
}

#status-progress,
#status-notice {
    display: none;
}

#status-progress {
    bottom: 10%;
    width: 50%;
    margin: 0 auto;
}

#status-notice {
    background-color: #5b3943;
    border-radius: 0.5rem;
    border: 1px solid #9b3943;
    color: #e0e0e0;
    font-family: Arial, sans-serif;
    line-height: 1.3;
    margin: 0 2rem;
    overflow: hidden;
    padding: 1rem;
    text-align: center;
    z-index: 1;
}

#wasm {
    position: fixed;
    bottom: 10px;
    right: 10px;
    color: white;
    font-family: "Press Start 2P", monospace;
    font-size: 10px;
    z-index: 9999;
    pointer-events: none;
    display: none;
    opacity: 0;
    transition: opacity 0.9s ease;
}

</style>

<link
    rel="icon"
    type="image/png"
    href="https://cdn.jsdelivr.net/gh/geez-2/basicintro@main/intros/7/index.png"
>

<link
    rel="apple-touch-icon"
    href="https://cdn.jsdelivr.net/gh/geez-2/basicintro@main/intros/7/index.png"
>

</head>

<body>

<canvas id="canvas">
    Your browser does not support the canvas tag.
</canvas>

<noscript>
    Your browser does not support JavaScript.
</noscript>

<div id="status">

    <img
        id="status-splash"
        src="https://cdn.jsdelivr.net/gh/geez-2/basicintro@main/intros/7/index.png"
        alt=""
    >

    <progress id="status-progress"></progress>

    <div id="status-notice"></div>

</div>

<div id="wasm">
    Port by plexilearcade.net
</div>

<script>

const CDN_BASE =
    "https://cdn.jsdelivr.net/gh/geez-2/basicintro@main/intros/7/";

const originalFetch =
    window.fetch.bind(window);

let pckURL = null;
let wasmURL = null;

let pckPromise = null;
let wasmPromise = null;


async function mergeFiles(parts) {

    const buffers = [];

    for (const part of parts) {

        const response =
            await originalFetch(
                CDN_BASE + part
            );

        if (!response.ok) {

            throw new Error(
                "Failed to load CDN file: " +
                part
            );

        }

        buffers.push(
            await response.arrayBuffer()
        );

    }

    return new Blob(buffers);

}


function getPCK() {

    if (!pckPromise) {

        pckPromise =
            mergeFiles([
                "index.part1.pck",
                "index.part2.pck",
                "index.part3.pck",
                "index.part4.pck"
            ])
            .then(blob => {

                pckURL =
                    URL.createObjectURL(blob);

                return pckURL;

            });

    }

    return pckPromise;

}


function getWASM() {

    if (!wasmPromise) {

        wasmPromise =
            mergeFiles([
                "index.part1.wasm",
                "index.part2.wasm"
            ])
            .then(blob => {

                wasmURL =
                    URL.createObjectURL(blob);

                return wasmURL;

            });

    }

    return wasmPromise;

}


window.fetch = async function(input, options) {

    const url =
        typeof input === "string"
            ? input
            : input instanceof Request
                ? input.url
                : String(input);


    if (
        /(?:^|\/)index\.pck(?:\?.*)?$/.test(url)
    ) {

        const mergedURL =
            await getPCK();

        return originalFetch(
            mergedURL,
            options
        );

    }


    if (
        /(?:^|\/)index\.wasm(?:\?.*)?$/.test(url)
    ) {

        const mergedURL =
            await getWASM();

        return originalFetch(
            mergedURL,
            options
        );

    }


    return originalFetch(
        input,
        options
    );

};

</script>


<script
    src="https://cdn.jsdelivr.net/gh/geez-2/basicintro@main/intros/7/index.js"
></script>


<script>

const GODOT_CONFIG = {

    args: [],

    canvasResizePolicy: 2,

    ensureCrossOriginIsolationHeaders: true,

    executable: "index",

    experimentalVK: false,

    fileSizes: {
        "index.pck": 73101440,
        "index.wasm": 35376909
    },

    focusCanvas: true,

    gdextensionLibs: []

};


const GODOT_THREADS_ENABLED = false;


const engine =
    new Engine(GODOT_CONFIG);


const statusOverlay =
    document.getElementById("status");

const statusProgress =
    document.getElementById("status-progress");

const statusNotice =
    document.getElementById("status-notice");


let initializing = true;

let statusMode = "";


function setStatusMode(mode) {

    if (
        statusMode === mode ||
        !initializing
    ) {
        return;
    }


    if (mode === "hidden") {

        statusOverlay.remove();

        initializing = false;

        return;

    }


    statusOverlay.style.visibility =
        "visible";

    statusProgress.style.display =
        mode === "progress"
            ? "block"
            : "none";

    statusNotice.style.display =
        mode === "notice"
            ? "block"
            : "none";

    statusMode =
        mode;

}


function setStatusNotice(text) {

    statusNotice.textContent =
        text;

}


function displayFailureNotice(err) {

    console.error(err);

    setStatusNotice(
        err && err.message
            ? err.message
            : String(err)
    );

    setStatusMode("notice");

    initializing = false;

}


const missing =
    Engine.getMissingFeatures({
        threads:
            GODOT_THREADS_ENABLED
    });


if (missing.length !== 0) {

    displayFailureNotice(
        "The following features are missing:\n" +
        missing.join("\n")
    );

} else {

    setStatusMode("progress");


    engine.startGame({

        onProgress:
            function(current, total) {

                if (
                    current > 0 &&
                    total > 0
                ) {

                    statusProgress.value =
                        current;

                    statusProgress.max =
                        total;

                }

            }

    }).then(

        function() {

            setStatusMode("hidden");


            setTimeout(function() {

                const credit =
                    document.getElementById(
                        "wasm"
                    );

                credit.style.display =
                    "block";


                setTimeout(function() {

                    credit.style.opacity =
                        "1";

                }, 50);

            }, 700);

        },

        displayFailureNotice

    );

}

</script>

</body>
</html>
