<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Baldi's Basics</title>

<link rel="icon" type="image/png"
href="https://cdn.jsdelivr.net/gh/geez-2/basicintro@main/intros/6/splash.png">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/gh/geez-2/basicintro@main/intros/6/TemplateData/style.css">

<script src="https://cdn.jsdelivr.net/gh/geez-2/basicintro@main/intros/6/TemplateData/UnityProgress.js"></script>

<script src="https://cdn.jsdelivr.net/gh/geez-2/basicintro@main/intros/6/baldi.js"></script>

</head>

<body style="margin:0;">

<div class="webgl-content">

<div id="unityContainer"
style="
width:960px;
height:600px;
padding:0;
margin:0;
border:0;
position:relative;
background:rgb(35,31,32);
">

<div id="gameContainer"
style="
width:800px;
height:560px;
margin:auto;
">
</div>

</div>

<script>

var CDN_BASE =
"https://cdn.jsdelivr.net/gh/geez-2/basicintro@main/intros/6/";

var gameInstance = UnityLoader.instantiate(
"gameContainer",
CDN_BASE + "baldi.json",
{
    onProgress: UnityProgress,

    Module: {
        onRuntimeInitialized: function() {
            UnityProgress(gameInstance, "complete");
        }
    }
});

</script>

<script src="https://cdn.jsdelivr.net/gh/geez-2/basicintro@main/intros/6/firebase-app.js"></script>

</div>

</body>
</html>
