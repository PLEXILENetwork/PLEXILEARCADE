<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Rajdhani, sans-serif;
}

body{
    height:100vh;
    background:
    linear-gradient(
        rgba(0,0,0,.50),
        rgba(0,0,0,.6)
    ),
    url("images/background.jpg");
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
}

.launcher{
    position:relative;
    z-index:2;
    width:640px;
    background:rgba(22, 22, 22, 0.89);
    border:1px solid #3a3a3a;
    border-radius:18px;
    padding:42px;
    text-align:center;
    box-shadow:
        0 18px 50px rgba(0,0,0,.45);
}

.title{
    display:flex;
    justify-content:center;
    margin-bottom:20px;
}

.title img{
    width:100%;
    max-width:305px; 
    height:auto;
    display:block;
    user-select:none;
    pointer-events:none;
}

.description{
    color:#a8a8a8;
    font-size:18px;
    padding:0;

}

.games{
    display:flex;
    gap:18px;
    margin-top:35px;
}

.card{
    flex:1;
    background:#2525259a;
    border:1px solid #3a3a3a;
    border-radius:12px;
    padding:22px 18px;
    cursor:pointer;
    transition:
        transform .18s,
        background .18s,
        border-color .18s;
}

.card:hover{
    background:#303030ce;
    transform:translateY(-3px);
}

.card:active{
    transform:translateY(0);
}

.card h2{
    font-size:28px;
    font-weight:700;
    margin-bottom:6px;
}

.card p{
    color:#a8a8a8;
    font-size:15px;
    padding:0;
}

@media(max-width:600px){

.games{
    flex-direction:column;
}

.launcher{
    width:90%;
}

}

.zombie{
    position:fixed;

    right:-8%;
    bottom:-6%;

    width:min(60vw, 950px);

    z-index:3;

    pointer-events:none;
    user-select:none;

    filter:drop-shadow(0 10px 20px rgba(0,0,0,.45));
}
@media(max-width:900px){

.zombie{
    width:650px;
    right:-180px;
    bottom:-40px;
}

}


@media(max-width:600px){

.zombie{
    width:500px;
    right:-170px;
    bottom:-30px;
}

}
</style>

</head>
<body>

<div class="launcher">

<div class="title">
    <img src="images/logo.png" alt="Plants vs Zombies">
</div>

<div class="description">
Choose your version:
</div>

<div class="games">
<div class="card" onclick="oldPVZ()">
<h2>PVZ Old</h2>
<p>Classic Edition</p>
</div>

<div class="card" onclick="newPVZ()">
<h2>PVZ New</h2>
<p>GOTY Edition</p>
</div>
</div>
</div>

<img src="images/zombie2.png" class="zombie" alt="">

<script>
function oldPVZ(){
    window.location.href="old.html";
}

function newPVZ(){
    window.location.href="new.html";
}
</script>

</body>
</html>
