<!doctype html>
<html>
<body>

<canvas
  id="canvas"
  width="800"
  height="600"
  style="display:block; outline:0"
></canvas>

<textarea
  id="pvz-soft-keyboard"
  style="position:fixed; top:0; left:0; width:1px; height:1px; opacity:0; pointer-events:none; font-size:16px"
  autocapitalize="off"
  autocomplete="off"
  autocorrect="off"
  enterkeyhint="done"
  spellcheck="false"
></textarea>

<script>
  const CDN_BASE =
    "https://cdn.jsdelivr.net/gh/geez-2/basicintro@main/intros/3/";

  let _res, _rej;

  window.moduleReadyPromise = new Promise((r, e) => {
    _res = r;
    _rej = e;
  });

  var Module = {
    canvas: document.getElementById("canvas"),
    noInitialRun: true,

    locateFile: function(path) {
      if (path === "pvz.wasm") {
        return CDN_BASE + "pvz.wasm";
      }

      return CDN_BASE + path;
    },

    onRuntimeInitialized: _res,

    onAbort: e => _rej(e),

    print: console.log,

    printErr: console.warn
  };
</script>

<script>
  async function fetchWithProgress(url) {
    const response = await fetch(url);

    if (!response.ok) {
      throw new Error(
        "Failed to load: " + url
      );
    }

    return await response.arrayBuffer();
  }

  async function mergeFiles(fileParts, cacheKey) {
    const cache =
      await caches.open("pvz-cache");

    const cachedResponse =
      await cache.match(cacheKey);

    if (cachedResponse) {
      const blob =
        await cachedResponse.blob();

      return URL.createObjectURL(blob);
    }

    const buffers =
      await Promise.all(
        fileParts.map(part =>
          fetchWithProgress(part)
        )
      );

    const mergedBlob =
      new Blob(buffers);

    const response =
      new Response(mergedBlob);

    await cache.put(
      cacheKey,
      response
    );

    return URL.createObjectURL(
      mergedBlob
    );
  }

  function getParts(
    file,
    start,
    end
  ) {
    let parts = [];

    for (
      let i = start;
      i <= end;
      i++
    ) {
      parts.push(
        file + ".part" + i
      );
    }

    return parts;
  }

  (async () => {

    const [pakurl] =
      await Promise.all([
        mergeFiles(
          getParts(
            CDN_BASE + "main.pak",
            1,
            3
          ),
          "main.pak"
        )
      ]);

    const ns =
      document.createElement("script");

    ns.src =
      CDN_BASE + "pvz.js";

    document.body.appendChild(ns);

    await moduleReadyPromise;

    const files = [
      [
        pakurl,
        "main.pak"
      ],

      [
        CDN_BASE +
          "properties/Layout.xml",
        "properties/Layout.xml"
      ],

      [
        CDN_BASE +
          "properties/partner.xml.sig",
        "properties/partner.xml.sig"
      ],

      [
        CDN_BASE +
          "properties/default.xml",
        "properties/default.xml"
      ],

      [
        CDN_BASE +
          "properties/partner.xml",
        "properties/partner.xml"
      ],

      [
        CDN_BASE +
          "properties/partner_logo.jpg",
        "properties/partner_logo.jpg"
      ]
    ];

    for (
      const [src, dest]
      of files
    ) {

      const response =
        await fetch(src);

      if (!response.ok) {
        throw new Error(
          "Failed to load: " + src
        );
      }

      const data =
        new Uint8Array(
          await response.arrayBuffer()
        );

      const parts =
        dest.split("/");

      let dir = "/";

      for (
        let i = 0;
        i < parts.length - 1;
        i++
      ) {

        dir +=
          (dir === "/" ? "" : "/") +
          parts[i];

        try {
          Module.FS.mkdir(dir);
        } catch {}
      }

      Module.FS.writeFile(
        "/" + dest,
        data
      );
    }

    try {
      Module.FS.mkdir("/saves");
    } catch {}

    try {
      Module.FS.mount(
        Module.FS.filesystems.IDBFS,
        {},
        "/saves"
      );
    } catch {}

    await new Promise(
      r => Module.FS.syncfs(true, r)
    );

    const c =
      document.getElementById(
        "canvas"
      );

    const resize = () => {

      const s =
        Math.min(
          innerWidth / 800,
          innerHeight / 600
        );

      c.style.width =
        s * 800 + "px";

      c.style.height =
        s * 600 + "px";
    };

    resize();

    addEventListener(
      "resize",
      resize
    );

    addEventListener(
      "fullscreenchange",
      resize
    );

    document.body.style =
      "margin:0;" +
      "background:#000;" +
      "display:flex;" +
      "justify-content:center;" +
      "align-items:center;" +
      "height:100vh;" +
      "overflow:hidden";

    const sync = () =>
      Module.FS.syncfs(
        false,
        () => {}
      );

    setInterval(
      sync,
      5000
    );

    addEventListener(
      "visibilitychange",
      () => {
        if (document.hidden) {
          sync();
        }
      }
    );

    addEventListener(
      "pagehide",
      sync
    );

    Module.callMain([]);

    if (
      typeof loadingText !==
      "undefined"
    ) {
      loadingText.remove();
    }

  })();
</script>

</body>
</html>
