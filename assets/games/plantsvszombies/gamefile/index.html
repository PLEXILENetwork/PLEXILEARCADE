<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Rajdhani,sans-serif;
}

body{
    height:100vh;
    background:
        linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.55)),
        url("images/background.jpg");
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
}

.launcher{
    position:relative;
    z-index:2;
    width:640px;
    background:#202020;
    border:1px solid #555;
    border-radius:4px;
    padding:34px;
    text-align:center;
    box-shadow:0 5px 18px rgba(0,0,0,.65);
}

.title{
    display:flex;
    justify-content:center;
    margin-bottom:14px;
}

.title img{
    width:100%;
    max-width:305px;
    height:auto;
    display:block;
    user-select:none;
    pointer-events:none;
}

.description{
    color:#bbb;
    font-size:17px;
    padding:0;
}

.games{
    display:flex;
    gap:10px;
    margin-top:25px;
}

.card{
    flex:1;
    background:linear-gradient(#363636,#292929);
    border:1px solid #555;
    border-radius:3px;
    padding:18px 15px;
    cursor:pointer;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 1px 2px rgba(0,0,0,.5);
    transition:background .1s;
}

.card:hover{
    background:linear-gradient(#414141,#303030);
}

.card:active{
    background:#252525;
}

.card h2{
    color:#eee;
    font-size:26px;
    font-weight:700;
    margin-bottom:4px;
}

.card p{
    color:#999;
    font-size:14px;
    padding:0;
}

.zombie{
    position:fixed;
    right:-8%;
    bottom:-6%;
    width:min(60vw,950px);
    z-index:3;
    pointer-events:none;
    user-select:none;
    filter:drop-shadow(0 5px 8px rgba(0,0,0,.55));
}

@media(max-width:900px){

    .zombie{
        width:650px;
        right:-180px;
        bottom:-40px;
    }

}

@media(max-width:600px){

    .games{
        flex-direction:column;
    }

    .launcher{
        width:90%;
        padding:26px 20px;
    }

    .zombie{
        width:500px;
        right:-170px;
        bottom:-30px;
    }

}
</style>

</head>
<body>

<div class="launcher">

<div class="title">
    <img src="images/logo.png" alt="Plants vs Zombies">
</div>

<div class="description">
Choose your version:
</div>

<div class="games">
<div class="card" onclick="oldPVZ()">
<h2>PVZ Old</h2>
<p>Classic Edition</p>
</div>

<div class="card" onclick="newPVZ()">
<h2>PVZ New</h2>
<p>GOTY Edition</p>
</div>
</div>
</div>

<img src="images/zombie2.png" class="zombie" alt="">

<script>
function oldPVZ(){
    window.location.href="old.html";
}

function newPVZ(){
    window.location.href="new.html";
}
</script>

</body>
</html>
