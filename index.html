<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PLEXILE ARCADE</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/css/main.css">

</head>
<body>

<div class="bottom-nav-container">
  <div class="bottom-nav">
    <a href="/" class="nav-btn"><i class="bx bx-home-alt"></i></a>
    <a href="/games.html" class="nav-btn"><i class="bx bx-joystick"></i></a>
    <div class="nav-spacer"></div>
    <a href="/apps.html" class="nav-btn"><i class="bx bx-grid-alt"></i></a>
    <a href="/faq.html" class="nav-btn"><i class="bx bx-help-circle"></i></a>
  </div>
  <a href="/settings.html" class="settings-fab">
    <i class="bx bx-cog"></i>
  </a>
</div>

<div class="main">
  <div class="page-header">
    <div>
      <h1>Welcome to PLEXILE ARCADE! 👋</h1>
      <p>Play instantly, no downloads, no sign up. Dive into games with action, puzzles, adventure and more.</p>
    </div>
  </div>

  <div class="search-bar">
    <i class="bx bx-search icon"></i>
    <input type="text" placeholder="Search for games...">
  </div>

  <div class="filters">
    <div class="filter-btn active">All</div>
    <div class="filter-btn">Action</div>
    <div class="filter-btn">Puzzle</div>
    <div class="filter-btn">Multiplayer</div>
    <div class="filter-btn">Strategy</div>
    <div class="filter-btn">Sports</div>
    <div class="filter-btn">Horror</div>
  </div>

  <section class="games-section">
    <div class="games-grid" id="gamesGrid">
      <div class="game-card" data-link="/iframe.html">
        <img src="https://raw.githubusercontent.com/willoo0/v6/refs/heads/main/public/images/games-images/roblox.png" alt="Roblox">
        <div class="info">
          <h3>Roblox</h3>
          <p>#Multiplayer</p>
        </div>
      </div>
      <div class="game-card" data-link="/iframe.html">
        <img src="https://raw.githubusercontent.com/willoo0/v6/refs/heads/main/public/images/games-images/baconmaydie.png" alt="Bacon May Die">
        <div class="info">
          <h3>Bacon May Die</h3>
          <p>#Action</p>
        </div>
      </div>
      <div class="game-card" data-link="/iframe.html">
        <img src="https://raw.githubusercontent.com/willoo0/v6/refs/heads/main/public/images/games-images/basketballstars.png" alt="Basketball Stars">
        <div class="info">
          <h3>Basketball Stars</h3>
          <p>#Sports</p>
        </div>
      </div>
      <div class="game-card" data-link="/iframe.html">
        <img src="https://raw.githubusercontent.com/willoo0/v6/refs/heads/main/public/images/games-images/bl.png" alt="Bitlife">
        <div class="info">
          <h3>Bitlife</h3>
          <p>#Strategy</p>
        </div>
      </div>
    </div>
  </section>
</div>

<script src="/js/search.js"></script>

</body>
</html>
