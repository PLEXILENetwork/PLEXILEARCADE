<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PLEXILE ARCADE - </title>  
  <link rel="manifest" href="/manifest.json"/>
  <link rel="icon" type="image/png" href="/assets/images/logo.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/iframe.css">

</head>
<body>

<div class="bottom-nav-container">
  <div class="bottom-nav">
    <a href="/" class="nav-btn"><i class="bx bx-home-alt"></i></a>
    <a href="/games.html" class="nav-btn"><i class="bx bx-joystick"></i></a>
    <div class="nav-spacer"></div>
    <a href="/apps.html" class="nav-btn"><i class="bx bx-grid-alt"></i></a>
    <a href="/faq.html" class="nav-btn"><i class="bx bx-help-circle"></i></a>
  </div>
    <button class="settings-fab" id="settingsBtn" type="button">
      <i class="bx bx-cog"></i>
    </button>
</div>

<div class="settings-overlay" id="settingsOverlay">
    <iframe
        id="settingsFrame"
        src="/settings.html"
        loading="lazy">
    </iframe>
</div>

<div class="background">
     <video id="background" autoplay muted loop playsinline></video>
    <div class="background-overlay"></div>
</div>

<div class="loader" id="loader">
    <img id="gameImage" class="thumbnail">
    <h1 id="gameTitle"></h1>

    <p class="loading-text">Loading game...</p>

    <div class="loading-bar">
        <div class="loading-fill"></div>
    </div>
</div>

<div class="game-container" id="gameContainer">
    <iframe id="gameFrame" allowfullscreen></iframe>

    <button class="fullscreen-btn" id="fullscreenBtn">
        <i class="bx bx-fullscreen"></i>
    </button>
</div>

<!--Settings-->
<script src="/assets/js/settings/analytics.js"></script>
<script src="/assets/js/settings/ads.js"></script>
<script src="/assets/js/settings/panickey.js"></script>
<script src="/assets/js/settings/savefile.js"></script>
<script src="/assets/js/settings/autocloak.js"></script>

<script src="/assets/js/settings.js"></script>
<script src="/assets/js/highlight.js"></script>
<script src="/assets/js/games.js"></script>
<script src="/assets/js/iframe.js"></script>
<script src="/assets/js/fullscreen.js"></script>

</body>
</html>
